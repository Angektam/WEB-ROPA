<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redireccionando...</title>
    <script type="text/javascript">
        // Redirige a la página principal para manejar el routing de Angular
        sessionStorage.redirect = location.href;
        location.replace(location.protocol + '//' + location.hostname + (location.port ? ':' + location.port : '') + '/WEB-ROPA/');
    </script>
</head>
<body>
    Si no eres redirigido automáticamente, haz clic <a href="/WEB-ROPA/">aquí</a>.
</body>
</html>
