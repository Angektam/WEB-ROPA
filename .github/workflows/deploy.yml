name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build:github-pages

      - name: Verify build output
        run: |
          if [ ! -d "./dist/boutique-ana/browser" ]; then
            echo "Error: Build output directory not found"
            ls -la ./dist/ || echo "dist directory does not exist"
            exit 1
          fi
          echo "Build output verified at ./dist/boutique-ana/browser"

      - name: Create 404.html for SPA routing
        run: |
          cp dist/boutique-ana/browser/index.html dist/boutique-ana/browser/404.html
          echo "Created 404.html for SPA routing"

      - name: Create .nojekyll file
        run: |
          touch dist/boutique-ana/browser/.nojekyll
          echo "Created .nojekyll file"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist/boutique-ana/browser'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4